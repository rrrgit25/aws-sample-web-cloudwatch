# Default values for sample-web.

replicaCount: 2

image:
  # Set to the ECR repository URL from `terraform output -raw ecr_repository_url`
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/sample-web
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Created and refreshed every 6 h on the server by ecr-pull-secret.timer.
imagePullSecrets:
  - name: ecr-pull
nameOverride: ""
# Keep this equal to the release name: the on-server monitor and log
# collection look for Deployment / pods named after var.app_name in Terraform.
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

containerPort: 8080

env:
  ENVIRONMENT: dev
  LOG_LEVEL: INFO
  # 1 worker per pod keeps memory low on a 1 GB free-tier instance.
  GUNICORN_WORKERS: "1"
  GUNICORN_THREADS: "4"
  # Set to "true" only while testing the CloudWatch alarms (see docs).
  ENABLE_CHAOS_ENDPOINTS: "false"

service:
  # On k3s, type LoadBalancer is served by the built-in ServiceLB on the
  # node's own port 80 - no (paid) AWS load balancer is created.
  type: LoadBalancer
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sample-web.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  # Small footprint for a t3.micro (2 vCPU burstable, 1 GB RAM).
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 160Mi

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Off by default: a single free-tier node has no room to scale out.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}

# Only useful with several nodes across zones.
topologySpreadConstraints:
  enabled: false
